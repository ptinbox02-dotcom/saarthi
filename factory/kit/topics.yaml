# The micro-lecture backlog. pipeline.py --all iterates these in order.
# id → used as folder name (lessons/<id>/) and CLI arg (--topic <id>).
# ML1.1 is the flagship: fact_sheet.md + script.md are already written (steps 1–6 done).

topics:
  - id: ML1.1
    title: "Discovery of the Electron — cathode rays & discharge tube"
    subject: chemistry
    chapter: "Structure of Atom"
    status: script_ready        # steps 1–6 complete; run step 7–9
    india_hook: "Tube light & purana CRT TV are literally cathode-ray tubes"
    # Terms the narration must actually contain. Per topic, because the config-level
    # list was ML1.1's vocabulary and would fail every other lesson.
    must_hear: [cathode, anode, electron, momentum, subatomic, Thomson, negative]
    # Reel windows, per topic. Each entry is [beat slug, regex over spoken chunks,
    # how many chunks to keep]. A null regex takes the whole beat. These MUST be per
    # topic: ML1.1's patterns matched nothing in ML5.10, and the silent fallback cut
    # the first 12 seconds of a beat mid-sentence.
    reel_picks:
      - [beat00, null, null]
      - [beat03, "plus plate ki taraf|opposite charges|beam khud", 3]
      - [beat05, "e ya m alag-alag|Sirf unka ratio|yeh galti", 3]

  - id: ML5.10
    title: "Shapes of s & p orbitals — spherical vs dumbbell"
    subject: chemistry
    chapter: "Structure of Atom"
    status: script_ready        # fact_sheet.md + script.md authored; run step 7-9
    india_hook: "s = laddoo (gol har taraf se), p = gym dumbbell (ek direction)"
    must_hear: [orbital, boundary surface, probability, spherical, dumbbell,
                nodal plane, degenerate, radial]
    reel_picks:
      - [beat00, null, null]                        # the hook, whole
      - [beat05, "do lobes ke beech", 1]            # the nodal plane itself
      - [beat05, "poori kahani ka nichod", 1]       # s gol / p dumbbell — the thesis

